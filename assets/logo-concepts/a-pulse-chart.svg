<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="0.55" stop-color="#4c1d95"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.45"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.35"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#glow)"/>
  <!-- area under the pulse -->
  <path d="M190 640 L330 640 L395 470 L470 760 L560 420 L640 560 L700 500 L830 330 L830 820 L190 820 Z" fill="url(#area)"/>
  <!-- pulse line that turns into a rising trend -->
  <path d="M190 640 L330 640 L395 470 L470 760 L560 420 L640 560 L700 500 L830 330" fill="none" stroke="url(#ln)"
        stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="830" cy="330" r="46" fill="#fff"/>
  <circle cx="830" cy="330" r="84" fill="#fff" opacity="0.18"/>
</svg>
