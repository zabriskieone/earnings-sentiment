[package]
name = "earningspulse"
version = "0.2.0"
description = "Sentiment & health from every quarterly result"
edition = "2021"

[lib]
name = "earningspulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
